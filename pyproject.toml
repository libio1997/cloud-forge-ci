[project]
name = "cloud-forge-ci"
version = "0.1.0"
description = "Laboratorio Cloud Forge: pipeline seguro con Ruff, pytest, Bandit y Trivy"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "reports", "dist"]
